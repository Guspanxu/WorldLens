name: Publish WorldLens

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test WorldLens
        run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy observation studio
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the public visitor URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${SITE_URL%/}"
          page="$RUNNER_TEMP/worldlens-index.html"
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$base/" --output "$page"
          grep -Fq '<title>WorldLens · 日常观察室</title>' "$page"
          for path in app/main.js lenses/designer.json photos/dialog.jpg; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$base/$path" --output /dev/null
          done
